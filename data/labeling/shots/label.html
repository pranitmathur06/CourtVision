footer{padding:10px 16px;color:var(--dim);border-top:1px solid var(--line)}
button{background:#1c2330;color:var(--fg);border:1px solid var(--line);border-radius:6px;
  padding:6px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}
</style>

{ const done=Object.keys(L).length; i=Math.min(done, Math.max(M.length-1,0)); show(); }

function show(){
  if(!M.length) return;
  const f=M[i];
  $('img').src='images/'+f.file;
  $('idx').textContent=i+1;
  $('meta').textContent=`shot ${f.shot} · ${f.kind} · ${f.video_s}s`;
  const lab=L[f.file], g=f.guess;
  const p = lab ? (lab.x===null?null:lab) : (g?{x:g.x,y:g.y}:null);
  place(p);
  const n=Object.values(L);
  $('nlab').textContent=n.filter(v=>v.x!==null).length;
  $('nno').textContent=n.filter(v=>v.x===null).length;
  $('fill').style.width=(100*Object.keys(L).length/M.length)+'%';
}
function place(p){
  const img=$('img'), dot=$('dot');
  if(!p){ dot.style.display='none'; return }
  const sx=img.clientWidth/M[i].w, sy=img.clientHeight/M[i].h;
  const r=BALL_PX*sx;
  dot.style.display='block';
  dot.style.width=dot.style.height=(r*1.6)+'px';
  dot.style.left=(p.x*sx-r*0.8)+'px';
  dot.style.top =(p.y*sy-r*0.8)+'px';
  dot.dataset.x=p.x; dot.dataset.y=p.y;
}
$('wrap').onclick=e=>{
  const img=$('img'), b=img.getBoundingClientRect();
  const x=(e.clientX-b.left)*M[i].w/img.clientWidth;
  const y=(e.clientY-b.top )*M[i].h/img.clientHeight;
  place({x,y});
};
function commit(v){ L[M[i].file]=v; localStorage.setItem('balllabels',JSON.stringify(L));
  if(i<M.length-1){i++; show()} else show(); }
addEventListener('keydown',e=>{
  if(e.key===' '){ e.preventDefault();
    const d=$('dot');
    if(d.style.display==='none') return;                 // nothing to confirm
    commit({x:+d.dataset.x, y:+d.dataset.y}); }
  else if(e.key==='x'||e.key==='X'){ commit({x:null,y:null}); }
  else if(e.key==='ArrowRight'){ if(i<M.length-1){i++;show()} }
  else if(e.key==='ArrowLeft'){ if(i>0){i--;show()} }
  else if(e.key==='u'||e.key==='U'){ delete L[M[i].file];
    localStorage.setItem('balllabels',JSON.stringify(L)); show(); }
});
function save(){
  const out=M.filter(f=>L[f.file]).map(f=>({file:f.file,w:f.w,h:f.h,
    x:L[f.file].x, y:L[f.file].y, box:BALL_PX, video_s:f.video_s, shot:f.shot}));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
  a.download='labels.json'; a.click();
}
