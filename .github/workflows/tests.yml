# The repository had no CI at all until now, and its test suite is the thing it
# argues from: 1,250 tests, several of which exist because a number in
# docs/continuous-game-accuracy.md was wrong and had to be retracted. A suite
# nobody runs on a clean machine is a suite that is green on one laptop.
#
# WHAT THIS DOES NOT DO. It does not run the GPU kernels, download a detector,
# decode a broadcast or reach stats.nba.com. Those need hardware or a network
# this cannot have, and a CI that pretends otherwise would go red for reasons
# that are not defects. The tests that need them skip themselves, and the job
# prints how many so that "green" cannot quietly come to mean "skipped".
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: system libraries opencv needs
        # `import cv2` fails on a bare Ubuntu runner with "libGL.so.1: cannot
        # open shared object file". It is the first thing this workflow would
        # have gone red on, and it is not a defect in anything here.
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: install
        run: |
          python -m pip install --upgrade pip
          # The CPU wheel: the full torch is 2.5 GB and nothing here needs CUDA.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: run the suite
        run: pytest -q -rs
      - name: how much of it actually ran
        if: always()
        run: |
          pytest -q --collect-only 2>/dev/null | tail -1
          echo "a green run with everything skipped is not a green run"
