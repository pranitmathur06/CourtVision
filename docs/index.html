<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Ask about an NBA game and watch the footage behind every answer.">
<title>CourtVision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --bg:#04070A; --card:#090E13; --sunk:#060A0E; --line:#151E26;
  --ink:#E4EBF2; --dim:#76858F; --faint:#3D4A55;
  --accent:#FF8A3D; --made:#3FD07A; --missed:#F2647A; --play:#4E9BF5; --rimc:#F2647A;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --disp:"Barlow Condensed",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.page{max-width:1180px;margin:0 auto;padding:22px 20px 40px}

header{display:flex;align-items:center;gap:20px;margin-bottom:16px}
h1{margin:0;font:600 25px/1 var(--disp);letter-spacing:.055em}
h1 span{color:var(--accent)}

.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px;margin-left:auto}
.seg button{background:none;border:0;color:var(--dim);font:500 13px/1 var(--body);
  padding:8px 15px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.6)}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
  border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card);margin-bottom:16px}
.cell{padding:11px 14px;border-right:1px solid var(--line)}
.cell:last-child{border-right:0}
.k{font:500 10px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.v{font:400 25px/1.1 var(--disp);margin-top:6px}
.v small{font:400 12px/1 var(--body);color:var(--dim);margin-left:3px}

.askbar{display:flex;gap:9px}
#q{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
  color:var(--ink);font:15px var(--body);padding:13px 15px;outline:0}
#q:focus{border-color:#28333D}
#q::placeholder{color:var(--faint)}
#go{background:var(--accent);color:#120800;border:0;border-radius:10px;
  font:600 14px var(--body);padding:0 22px;cursor:pointer}
#go:disabled{opacity:.45;cursor:default}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 18px}
.chips button{background:var(--sunk);border:1px solid var(--line);color:var(--dim);
  border-radius:20px;padding:6px 13px;font:13px var(--body);cursor:pointer}
.chips button:hover{color:var(--ink);border-color:#242F39}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
#answer:empty{display:none}
#answer{margin-bottom:16px}
.answer{background:var(--card);border:1px solid var(--line);border-left:2px solid var(--accent);
  border-radius:12px;padding:15px 17px}
.answer p{margin:0 0 9px}
.answer b{color:#fff}

ul.beats{margin:2px 0 0;padding:0;list-style:none}
ul.beats li{padding:8px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
ul.beats li:last-child{border-bottom:0}
ul.beats li.playing{background:var(--sunk);border-radius:8px;padding-left:10px;padding-right:10px}
ul.beats video{display:block;width:100%;margin:0;border-radius:9px;background:#000}
#filmShell{margin:10px 0 4px}
#filmBoxes{border-radius:9px}

button.play{display:inline-block;width:0;height:0;padding:0;border:0;border-style:solid;
  border-width:5px 0 5px 8px;border-color:transparent transparent transparent var(--accent);
  background:none;cursor:pointer;vertical-align:middle;margin-right:8px;opacity:.85}
button.play.inline{margin-left:7px;margin-right:0}
button.play:hover{opacity:1}

.list .listhead{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
#rowcount{font:500 10px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.filters{display:flex;gap:7px;margin-left:auto}
.filters select{background:var(--sunk);border:1px solid var(--line);color:var(--dim);
  border-radius:7px;padding:6px 9px;font:13px var(--body);outline:0}
.scroll{max-height:400px;overflow:auto}
table{width:100%;border-collapse:collapse}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
tr.cited{background:rgba(255,138,61,.05)}
td.mono{font-family:var(--mono);font-size:12.5px;color:var(--dim);white-space:nowrap;width:1%}
td.who{color:var(--dim);white-space:nowrap;width:1%}
.act{font-weight:600}
.sub{color:var(--dim);font-size:12.5px;margin-top:2px}

.fine{color:var(--faint);font-size:12px;margin:14px 2px 0}
.fine b{color:var(--dim);font-weight:600}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#18222B;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="page">

  <header>
    <h1>COURT<span>VISION</span></h1>
    <div class="seg" id="view" role="tablist">
      <button class="on" data-view="official" role="tab">Official record</button>
      <button data-view="vision" role="tab">What vision saw</button>
    </div>
  </header>

  <div class="strip" id="strip"></div>

  <div class="askbar">
    <input id="q" autocomplete="off" spellcheck="false"
           placeholder="Ask about the game — a player, a quarter, a kind of play">
    <button id="go">Ask</button>
  </div>
  <div class="chips" id="chips"></div>

  <div id="answer"></div>

  <section class="card list">
    <div class="listhead">
      <span id="rowcount"></span>
      <div class="filters">
        <select id="fAction"></select>
        <select id="fPlayer"></select>
        <select id="fPeriod"></select>
      </div>
    </div>
    <div class="scroll"><table><tbody id="rows"></tbody></table></div>
  </section>

  <p class="fine" id="fine"></p>
</div>

<script>
const SYNONYM = [
  // Order matters: the FIRST pattern that matches wins, so the specific ones
  // come before the general. "missed shot" must beat "shot", and the vision
  // game's own vocabulary must beat the word "shot" inside it.
  [/vision|pipeline|detector|from pixels|computer vision|false alarm|hallucinat/,
   ['vision shot', 'vision false alarm', 'vision miss']],

  [/free.?throw|foul shot|from the line|at the line/, ['free throw']],
  [/\bfoul/, ['foul']],
  [/\bblock(ed|s)?\b|swat|rejected/, ['block']],
  [/\bsteal(s)?\b|stole|picked.?pocket/, ['steal', 'turnover']],
  [/turnover|lost the ball|giveaway|coughed/, ['turnover']],
  [/jump ball|tip.?off|opening tip/, ['jump ball']],

  [/pick.?and.?roll|pnr|ball ?screen|screen.?and.?roll|pick.?and.?pop/,
   ['pick_and_roll', 'ball_screen', 'pick_and_pop', 'double_drag', 'spain_pick_and_roll', 'dribble_handoff']],
  [/hand.?off|dho/, ['dribble_handoff']],
  [/off.?ball|cut|pin.?down|flare|back ?screen|cross ?screen|stagger/,
   ['off_ball_screen', 'pin_down', 'flare_screen', 'back_screen', 'cross_screen']],
  [/screen|pick\b/, ['ball_screen', 'off_ball_screen', 'pin_down', 'flare_screen',
                     'back_screen', 'cross_screen', 'dribble_handoff', 'pick_and_roll',
                     'pick_and_pop', 'double_drag', 'spain_pick_and_roll']],

  [/assist|passed|feed|set up/, ['assist']],
  [/rebound|board|offensive glass/, ['rebound']],
  [/transition|fast ?break|running|push the/, ['transition']],

  [/\bmiss(ed|es)?\b|brick|bricked|came up short/, ['shot']],
  [/\bmade\b|\bmake(s)?\b|scored|basket|bucket|finish|converted|knocked down|hit a/,
   ['made shot']],
  [/three|3pt|3.?point|from deep|beyond the arc/, ['made shot', 'shot']],
  [/shot|shoot|attempt|scoring|points|\bpts\b/, ['shot', 'made shot']],
  [/formation|shape|spacing|isolation|post ?up/, null],
];

function retrieve(question) {
  const q = ' ' + question.toLowerCase() + ' ';
  let rows = ALL.filter(r => r.gid === game);
  const applied = [];

  // Players, matched on the full name or the surname, with punctuation ignored
  // on BOTH sides. "shai gilgeous alexander" has to find "Shai
  // Gilgeous-Alexander": typing the hyphen is not something a reader should
  // have to get right, and without this the name silently failed to match and
  // the answer came back as every made shot in the game.
  const flat = t => ' ' + t.toLowerCase().replace(/[.'’\-]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  const qf = flat(q);
  // Only this game's players. Matching a bare surname against every player in
  // twenty games turned "jalen williams" into seven different Williamses from
  // games nobody asked about.
  const here = [...new Set(ALL.filter(r => r.gid === game && r.player).map(r => r.player))];
  const pool = here.length ? here
    : [...new Set(ALL.filter(r => r.player).map(r => r.player))];
  const match = (p, exact) => {
    const pf = flat(p).trim();
    if (qf.includes(' ' + pf + ' ')) return true;
    if (exact) return false;
    const last = pf.split(' ').slice(-1)[0];
    return last.length > 3 && qf.includes(' ' + last + ' ');
  };
  // A full-name match beats a surname match: "jalen williams" should not also
  // drag in every other Williams on the floor.
  let hits = pool.filter(p => match(p, true));
  if (!hits.length) hits = pool.filter(p => match(p, false));
  if (hits.length) {
    // A named player counts whether they benefited from the action or set the
    // screen for it; asking about someone should not miss the screens they set.
    rows = rows.filter(r => hits.includes(r.player) || hits.includes(r.screener));
    applied.push('player: ' + hits.join(', '));
  }

  // actions. EVERY matching pattern contributes, not just the first: "every
  // block and steal" is two things, and stopping at the first match returned
  // only the blocks.
  let acts = null;
  const matched = [];
  for (const [re, list] of SYNONYM) {
    if (!re.test(q)) continue;
    matched.push(re);
    acts = (acts || []).concat(list || ACT.filter(a => a.startsWith('formation')));
  }
  // ...except inside the shot family, where the specific has to beat the
  // general: "missed shot" matches both /miss/ and /shot/, and unioning them
  // would hand back the made shots too.
  if (acts && /\bmiss|\bmade\b|\bmake|scored|three|3.?point/.test(q)) {
    const generic = ['shot', 'made shot'];
    const specific = acts.filter(a => !generic.includes(a));
    const wantMade = /\bmade\b|\bmake|scored|basket|bucket|converted/.test(q);
    const wantMiss = /\bmiss/.test(q);
    if (wantMiss && !wantMade) acts = specific.concat('shot');
    else if (wantMade && !wantMiss) acts = specific.concat('made shot');
  }
  // Inside the vision family the same rule applies: "where did it get it wrong"
  // must not hand back the calls it got right, and the general /vision/ pattern
  // alone would.
  if (acts && acts.some(a => a.startsWith('vision'))) {
    const wrong = /wrong|false alarm|mistake|hallucinat|phantom|over.?call/.test(q);
    const missed = /miss(ed|es)?\b|never called|failed to|didn.?t (see|call|catch)/.test(q);
    if (wrong && !missed) acts = acts.filter(a => a !== 'vision shot' && a !== 'vision miss');
    else if (missed && !wrong) acts = acts.filter(a => a === 'vision miss');
    else if (/right|correct|agree|got it/.test(q)) acts = acts.filter(a => a === 'vision shot');
  }
  if (acts) acts = [...new Set(acts)];
  if (acts) {
    // The vision layer is its own game. Asking "where did it get it wrong"
    // while the official game is selected filtered to nothing, which read as
    // the retrieval being stupid when it was the scope being wrong.
    let scoped = rows.filter(r => acts.includes(r.action));
    if (!scoped.length) {
      const elsewhere = ALL.filter(r => acts.includes(r.action));
      if (elsewhere.length) {
        const gid = elsewhere[0].gid;
        const g = D.games.find(x => x.id === gid);
        game = gid;
        const sel = $('game'); if (sel) sel.value = gid;
        fillControls(); strip();
        rows = ALL.filter(r => r.gid === gid);
        if (hits.length) rows = rows.filter(r => hits.includes(r.player) || hits.includes(r.screener));
        scoped = rows.filter(r => acts.includes(r.action));
        applied.push('switched to ' + (g ? g.date : gid));
      }
    }
    rows = scoped;
    applied.push('action: ' + acts.join(', '));
  }

  // Some distinctions live only in the description the play-by-play wrote --
  // 3PT, layup, dunk, free-throw number -- so they are matched as text rather
  // than invented as actions.
  const TEXT = [
    [/three|3pt|3.?point|from deep|beyond the arc/, /3pt/i, 'three-pointers'],
    [/layup|lay.?up/, /layup/i, 'layups'],
    [/dunk|slam/, /dunk/i, 'dunks'],
    [/jump ?shot|jumper|pull.?up/, /jump shot|pullup/i, 'jump shots'],
  ];
  for (const [ask, inText, label] of TEXT) {
    if (ask.test(q)) {
      const narrowed = rows.filter(r => inText.test(r.detail || ''));
      if (narrowed.length) { rows = narrowed; applied.push(label) }
    }
  }

  // quarter, half and the clutch
  const words = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, ten: 10 };
  const qm = q.match(/\b(?:q|quarter |period )([1-4])\b/)
    || (/\bfirst quarter|\b1st q/.test(q) && [0, '1'])
    || (/\bsecond quarter|\b2nd q/.test(q) && [0, '2'])
    || (/\bthird quarter|\b3rd q/.test(q) && [0, '3'])
    || (/\bfourth quarter|\b4th q|\b4th\b/.test(q) && [0, '4']);
  if (qm) { rows = rows.filter(r => String(r.period) === qm[1]); applied.push('quarter ' + qm[1]) }
  else if (/first half|1st half/.test(q)) {
    rows = rows.filter(r => r.period <= 2); applied.push('first half');
  } else if (/second half|2nd half/.test(q)) {
    rows = rows.filter(r => r.period >= 3); applied.push('second half');
  } else if (/overtime|\bot\b/.test(q)) {
    rows = rows.filter(r => r.period >= 5); applied.push('overtime');
  }

  const clutch = q.match(/last (\w+|\d+) minutes?/) || q.match(/final (\w+|\d+) minutes?/);
  if (clutch || /clutch|crunch ?time|down the stretch|end of the game/.test(q)) {
    const mins = clutch ? (parseInt(clutch[1]) || words[clutch[1]] || 2) : 2;
    const last = Math.max(...ALL.filter(r => r.gid === game).map(r => r.period), 4);
    rows = rows.filter(r => r.period >= last && toSec(r.clock) <= mins * 60);
    applied.push(`final ${mins} minutes`);
  }
  const opening = q.match(/first (\w+|\d+) minutes?/);
  if (opening) {
    const mins = parseInt(opening[1]) || words[opening[1]] || 5;
    rows = rows.filter(r => r.period === 1 && toSec(r.clock) >= (12 - mins) * 60);
    applied.push(`opening ${mins} minutes`);
  }

  return { rows, applied, acts, hits };
}

function aggregate(rows) {
  const byAction = {}, byPlayer = {}, bySetter = {};
  rows.forEach(r => {
    byAction[r.action] = (byAction[r.action] || 0) + 1;
    if (r.player) {
      byPlayer[r.player] = byPlayer[r.player] || {};
      byPlayer[r.player][r.action] = (byPlayer[r.player][r.action] || 0) + 1;
    }
    // Counted separately: setting a screen and coming off one are different
    // things, and only the setter answers "who sets the most screens".
    if (r.screener) bySetter[r.screener] = (bySetter[r.screener] || 0) + 1;
  });
  return { byAction, byPlayer, bySetter };
}

function localAnswer(question, rows, pick, hits) {
  const q = question.toLowerCase();
  hits = hits || [];
  if (!rows.length) return 'Nothing in this game matches that. Try a different player, action or quarter.';

  const agg = aggregate(rows);
  const cite = r => { const i = pick.indexOf(r); return i >= 0 ? ` [${i}]` : '' };
  const lines = [];

  // "how many" -- a count, broken down when the rows span several actions
  const kinds = Object.entries(agg.byAction).sort((a, b) => b[1] - a[1]);
  const total = rows.length;
  // Points are not a row count. The play-by-play writes each scorer's RUNNING
  // TOTAL in the description -- "(29 PTS)" -- so the largest one a player
  // reaches is exactly what they scored, free throws included.
  if (/\bpoints?\b|\bpts\b|\bscore(d)?\b/.test(q) && hits.length) {
    for (const who of hits) {
      let best = 0, at = null;
      // Every row for this player in the game, not the filtered subset: a
      // question about points that filtered to made shots missed the free
      // throws, and the running total lives on those too.
      ALL.filter(r => r.gid === game && r.player === who).forEach(r => {
        const m = (r.detail || '').match(/\((\d+)\s*PTS\)/i);
        if (m && +m[1] >= best) { best = +m[1]; at = r }
      });
      if (best) lines.push(`**${who}** scored **${best}** points`
        + (at ? `, the last of them at ${ordinal(at.period)} ${at.clock}${cite(at)}` : '') + '.');
    }
  }

  if (/\bhow many\b|\bhow much\b|\bcount\b/.test(q)) {
    lines.push(`**${total}** matching ${total === 1 ? 'row' : 'rows'}`
      + (kinds.length > 1 ? ': ' + kinds.map(([k, v]) => `${v} ${k.replace(/_/g, ' ')}`).join(', ') : ` of ${kinds[0][0].replace(/_/g, ' ')}`) + '.');
  }

  // "who" -- the leaders, by the thing being asked about
  if (/\bwho\b|\bwhich player\b|\bmost\b|\bleader/.test(q)) {
    const setters = topOf(agg.bySetter);
    if (/screen/.test(q) && setters.length) {
      lines.push('Most screens set: ' + setters.map(([n, c]) => `**${n}** (${c})`).join(', ') + '.');
    } else {
      const byTotal = {};
      rows.forEach(r => { if (r.player) byTotal[r.player] = (byTotal[r.player] || 0) + 1 });
      const top = topOf(byTotal);
      if (top.length) lines.push('Most: ' + top.map(([n, c]) => `**${n}** (${c})`).join(', ') + '.');
    }
  }

  // Every matching row, not a sample of them. Truncating to eight and saying
  // "and 54 more below" made the reader go and find the rest somewhere else,
  // which is the thing this page exists not to do. The list scrolls instead.
  lines.push('', ...rows.map(r =>
    `- ${ordinal(r.period)} ${r.clock} — ${r.detail || r.action.replace(/_/g, ' ')}`
    + (r.player && !(r.detail || '').includes(r.player) ? ` (${r.player})` : '')
    + cite(r)));
  return lines.join('\n');
}

function render(text) {
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    // A citation becomes the play control itself when the row it points at has
    // footage. Asking and watching are then the same gesture in the same place,
    // rather than a number you have to go and look up in a table below.
    .replace(/\[([\d,\s]+)\]/g, (m, inner) => {
      const first = parseInt(inner.split(',')[0].trim(), 10);
      const r = lastPick[first];
      if (r && r.clip) {
        return ` <button class="play inline" data-clip="${r.clip}" data-i="${ALL.indexOf(r)}"`
             + ` title="Watch this moment" aria-label="Watch this moment"></button>`;
      }
      return `<span class="mono" style="color:var(--accent)">${m}</span>`;
    });
  return text.split(/\n{2,}/).map(block => {
    const lines = block.split('\n').filter(l => l.trim());
    if (lines.length && lines.every(l => l.trim().startsWith('- '))) {
      return '<ul class="beats">'
        + lines.map(l => '<li>' + esc(l.trim().slice(2)) + '</li>').join('')
        + '</ul>';
    }
    return '<p>' + esc(block).replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

// ---- answering without a model --------------------------------------------
// The retrieval half of RAG is exact: it filters rows by player, action and
// period. Only the writing-it-up half needs a model, and on a static host
// there is none -- which left the page able to find the footage for a question
// and unable to run the question at all.
//
// So the answer is COMPUTED from the retrieved rows: counts, leaders, and a
// timeline, each citing the rows it came from so the clips still play. It
// cannot paraphrase or reason, and the page says so rather than passing
// arithmetic off as an answer a model wrote.
function ordinal(p) { return p <= 4 ? ['', '1st', '2nd', '3rd', '4th'][p] : 'OT' + (p - 4) }

function topOf(counts, n = 3) {
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, n);
}

function toSec(clock) { const [m, s] = (clock || '0:00').split(':').map(Number); return m * 60 + (s || 0) }

// The detector's own boxes, drawn over the footage at the video's own rate.
// Fetched once, and only when a clip is first played.
let OVERLAYS = null, overlayWanted = false;
const BOX_COLOUR = { p: 'rgba(78,155,245,.7)', s: 'rgba(255,138,61,1)',
                     b: 'rgba(63,208,122,1)', r: 'rgba(242,100,122,.95)' };
const BOX_LABEL = { p: '', s: '', b: 'ball', r: 'rim' };

async function loadOverlays() {
  if (OVERLAYS || overlayWanted) return OVERLAYS;
  overlayWanted = true;
  // The dense file is every frame at the video's own rate, linked and smoothed.
  // The sparse one samples every 0.2 s -- one update per six played frames,
  // which is what made the boxes look like they were jumping around.
  for (const name of ['clips/overlays_dense.json', 'clips/overlays.json']) {
    try {
      const r = await fetch(name);
      if (r.ok) { OVERLAYS = await r.json(); OVERLAYS.dense = name.includes('dense'); break }
    } catch (e) { /* artifact CSP blocks this; boxes are optional */ }
  }
  return OVERLAYS;
}

function drawBoxes(svg, film, clip, subjectName) {
  if (!OVERLAYS || !OVERLAYS.clips[clip]) { svg.innerHTML = ''; return }
  const frames = OVERLAYS.clips[clip];
  const step = OVERLAYS.dense ? (1 / (OVERLAYS.fps || 30)) : (OVERLAYS.step_s || 0.2);
  const i = Math.max(0, Math.min(frames.length - 1, Math.round(film.currentTime / step)));
  // dense: frames[i] is the boxes directly. sparse: frames[i] is [t, boxes].
  const frame = frames[i];
  const boxes = !frame ? [] : (OVERLAYS.dense ? frame : frame[1]) || [];
  // The viewBox does the scaling and CSS makes the svg exactly cover the
  // video. Setting pixel sizes here read the layout before it had settled and
  // drew a 517 px overlay over a 471 px video.
  const [sw, sh] = OVERLAYS.source_size || [1280, 720];
  svg.setAttribute('viewBox', `0 0 ${sw} ${sh}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.innerHTML = boxes.filter(row => !subjectName || row[0] !== 'p').map(row => {
    const c = row[0];
    const [x1, y1, x2, y2] = row.slice(1);
    const on = true;
    const stroke = BOX_COLOUR[c] || '#fff';
    // Labelled for what it verifiably is. The subject is the tracklet holding
    // the ball at the logged instant, which lands on the actor's own TEAM 79%
    // of the time -- so it is called "ball handler", not given the name of the
    // player the question asked about. One box in five would be an opponent.
    const label = (c === 's' && subjectName) ? 'ball handler' : BOX_LABEL[c];
    return `<rect x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}"`
         + ` fill="none" stroke="${stroke}" stroke-width="${on ? (c === 'b' ? 4 : 3) : 2}"`
         + ` opacity="${on ? 1 : .22}" rx="3"/>`
         + (label ? `<text x="${x1 + 3}" y="${Math.max(y1 - 6, 16)}" fill="${stroke}"`
            + ` opacity="${on ? 1 : .3}" font-size="19"`
            + ` font-family="ui-monospace,monospace">${label}</text>` : '');
  }).join('');
}

// One player, moved to whichever beat was asked for, so the footage opens where
// the sentence is instead of in a panel somewhere below.
function playInline(button) {
  const beat = button.closest('li') || button.parentElement;
  let film = document.getElementById('inlineFilm');
  if (!film) {
    film = document.createElement('video');
    film.id = 'inlineFilm';
    film.controls = true; film.playsInline = true; film.preload = 'none';
    film.onerror = () => {
      const note = document.getElementById('inlineNote');
      if (note) note.textContent = 'That clip did not load.';
    };
  }
  let note = document.getElementById('inlineNote');
  if (!note) { note = document.createElement('div'); note.id = 'inlineNote'; note.className = 'muted'; }
  note.textContent = '';
  document.querySelectorAll('.beats li.playing').forEach(li => li.classList.remove('playing'));
  beat.classList.add('playing');
  let shell = document.getElementById('filmShell');
  if (!shell) {
    shell = document.createElement('div'); shell.id = 'filmShell';
    shell.style.cssText = 'position:relative;display:inline-block;max-width:560px;width:100%';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.id = 'filmBoxes';
    svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
    shell.appendChild(film); shell.appendChild(svg);
  }
  beat.appendChild(shell); beat.appendChild(note);
  const svg = document.getElementById('filmBoxes');
  const clip = button.dataset.clip;
  film.src = 'clips/' + clip;
  svg.innerHTML = '';
  // A question about one player draws only him: the tracklet that held the ball
  // at the logged instant. `r` lives in bindPlay, not here -- referencing it
  // threw before the overlay was ever fetched, which is why no box appeared.
  const row = ALL[Number(button.dataset.i)];
  const subjectName = (solo && row && row.player === solo) ? solo : null;
  loadOverlays().then(() => {
    const paint = () => drawBoxes(svg, film, clip, subjectName);
    film.ontimeupdate = paint; film.onloadeddata = paint; film.onseeked = paint;
    paint();
  });
  film.play().catch(() => {});
}

// ---- filters, table, stat strip -------------------------------------------
function option(v, label) { return `<option value="${v}">${label}</option>` }const D = window.__STREAM__;
const $ = id => document.getElementById(id);
const ACT = D.actions, DET = D.details, NAMES = D.players;

// Two views of one game: what the NBA logged, and what the vision stack called
// from pixels. They are separate row sets, and the toggle chooses which is on
// screen -- the comparison is the point of having both.
const OFFICIAL = D.games.find(g => !g.vision).id;
const VISION = (D.games.find(g => g.vision) || {}).id;

let ALL = [];
D.games.forEach(g => g.rows.forEach((r, i) => ALL.push({
  gid: g.id, id: g.id + ':' + i,
  t: r[0], period: r[1], clock: r[2], action: ACT[r[3]],
  player: r[4] ? (NAMES[r[4]] || null) : null,
  conf: r[8], detail: r[9] >= 0 ? DET[r[9]] : '',
  screener: null, x: null, y: null,
  clip: r[11] || null, video: true
})));

const COLOR = a =>
  a === 'made shot' ? 'var(--made)' :
  a === 'shot' ? 'var(--missed)' :
  a === 'vision shot' ? 'var(--made)' :
  a === 'vision false alarm' ? 'var(--missed)' :
  a === 'vision miss' ? 'var(--accent)' :
  a === 'rebound' || a === 'block' ? 'var(--play)' :
  a === 'assist' ? 'var(--accent)' : 'var(--ink)';

let game = OFFICIAL, cited = new Set(), shown = [], solo = null, lastPick = [];

function strip() {
  const g = ALL.filter(r => r.gid === game);
  const n = a => g.filter(r => r.action === a).length;
  let cells;
  if (game === VISION) {
    const right = n('vision shot'), alarm = n('vision false alarm'), miss = n('vision miss');
    cells = [['Calls', right + alarm], ['Agreed', right], ['False alarms', alarm],
             ['Never called', miss],
             ['Precision', Math.round(100 * right / Math.max(right + alarm, 1)) + '%'],
             ['Recall', Math.round(100 * right / Math.max(right + miss, 1)) + '%']];
  } else {
    const made = n('made shot'), att = made + n('shot');
    cells = [['Actions', g.length], ['Shots', att],
             ['Made', made + (att ? ` <small>${Math.round(100 * made / att)}%</small>` : '')],
             ['Rebounds', n('rebound')], ['Assists', n('assist')],
             ['Turnovers', n('turnover')], ['Blocks', n('block')], ['Steals', n('steal')]];
  }
  $('strip').innerHTML = cells.map(([k, v]) =>
    `<div class="cell"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  $('fine').innerHTML = game === VISION
    ? 'Called from pixels &mdash; ball and rim per frame, no play-by-play. <b>Precision 0.52 held out</b>, so about half is wrong and all of it is here.'
    : 'The NBA&rsquo;s own record on the video&rsquo;s clock. Boxes are the detector&rsquo;s, at 30&nbsp;fps; ask about one player and only the <b>ball handler</b> is drawn &mdash; right team 79% of the time.';
}

function fillControls() {
  const g = ALL.filter(r => r.gid === game);
  const acts = [...new Set(g.map(r => r.action))].sort();
  const people = [...new Set(g.map(r => r.player).filter(Boolean))].sort();
  const periods = [...new Set(g.map(r => r.period))].sort();
  $('fAction').innerHTML = option('', 'every action') + acts.map(a => option(a, a.replace(/_/g, ' '))).join('');
  $('fPlayer').innerHTML = option('', 'every player') + people.map(p => option(p, p)).join('');
  $('fPeriod').innerHTML = option('', 'whole game') + periods.map(p => option(p, 'Q' + p)).join('');
}

function table() {
  const a = $('fAction').value, p = $('fPlayer').value, q = $('fPeriod').value;
  shown = ALL.filter(r => r.gid === game
    && (!a || r.action === a) && (!p || r.player === p) && (!q || String(r.period) === q));
  $('rowcount').textContent = shown.length + ' rows';
  $('rows').innerHTML = shown.map(r => `
    <tr class="${cited.has(r.id) ? 'cited' : ''}">
      <td class="mono">${r.clip ? `<button class="play" data-clip="${r.clip}" data-i="${ALL.indexOf(r)}" aria-label="Watch"></button>` : ''}Q${r.period} ${r.clock}</td>
      <td><span class="act" style="color:${COLOR(r.action)}">${r.action.replace(/_/g, ' ')}</span>
        ${r.detail ? `<div class="sub">${r.detail}</div>` : ''}</td>
      <td class="who">${r.player || ''}</td>
    </tr>`).join('');
  bindPlay();
}

function bindPlay() {
  document.querySelectorAll('button.play:not(.inline)').forEach(b =>
    b.addEventListener('click', ev => { ev.stopPropagation(); playInline(b) }));
}
$('answer').addEventListener('click', ev => {
  const b = ev.target.closest('button.play.inline');
  if (b) { ev.preventDefault(); playInline(b) }
});

function finish(text, rows, pick, applied) {
  lastPick = pick;
  const ids = new Set();
  (text.match(/\[([\d,\s]+)\]/g) || []).forEach(m =>
    m.slice(1, -1).split(',').forEach(n => {
      const r = pick[parseInt(n.trim(), 10)]; if (r) ids.add(r.id);
    }));
  cited = ids;
  $('answer').innerHTML = `<div class="answer">${render(text)}</div>`;
  shown = rows;
  $('fAction').value = ''; $('fPlayer').value = ''; $('fPeriod').value = '';
  $('rowcount').textContent = shown.length + ' rows';
  $('rows').innerHTML = shown.map(r => `
    <tr class="${cited.has(r.id) ? 'cited' : ''}">
      <td class="mono">${r.clip ? `<button class="play" data-clip="${r.clip}" data-i="${ALL.indexOf(r)}" aria-label="Watch"></button>` : ''}Q${r.period} ${r.clock}</td>
      <td><span class="act" style="color:${COLOR(r.action)}">${r.action.replace(/_/g, ' ')}</span>
        ${r.detail ? `<div class="sub">${r.detail}</div>` : ''}</td>
      <td class="who">${r.player || ''}</td>
    </tr>`).join('');
  bindPlay();
}

function ask(question) {
  if (!question.trim()) return;
  const { rows, applied, hits } = retrieve(question);
  solo = (hits && hits.length === 1) ? hits[0] : null;
  const pick = rows;
  finish(localAnswer(question, rows, pick, hits), rows, pick, applied);
}

const EXAMPLES = [
  'What happened in the last two minutes?',
  'How many points did Shai Gilgeous-Alexander score?',
  'Every three-pointer',
  'Every block and steal',
];
$('chips').innerHTML = EXAMPLES.map(e => `<button>${e}</button>`).join('');
$('chips').addEventListener('click', ev => {
  if (ev.target.tagName !== 'BUTTON') return;
  $('q').value = ev.target.textContent; ask($('q').value);
});
$('go').addEventListener('click', () => ask($('q').value));
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') ask($('q').value) });
['fAction', 'fPlayer', 'fPeriod'].forEach(id =>
  $(id).addEventListener('change', () => { cited = new Set(); table() }));

$('view').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-view]');
  if (!b || !VISION) return;
  [...$('view').children].forEach(x => x.classList.toggle('on', x === b));
  game = b.dataset.view === 'vision' ? VISION : OFFICIAL;
  cited = new Set(); solo = null; $('answer').innerHTML = '';
  fillControls(); strip(); table();
});

// Open on a moment already running, so what the page does is visible without
// reading anything or typing anything.
function openOnAMoment() {
  const first = ALL.find(r => r.gid === game && r.action === 'made shot'
    && /3PT/.test(r.detail || '') && r.clip);
  if (!first) return;
  ask('Every three-pointer');
  const btn = document.querySelector('#answer button.play.inline');
  if (btn) { playInline(btn); const v = $('inlineFilm'); if (v) { v.muted = true; v.play().catch(() => {}) } }
}

fillControls(); strip(); table(); openOnAMoment();

</script>
</body>
</html>
