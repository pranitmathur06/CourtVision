[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courtvision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
    "supervision>=0.25",
    "scikit-learn>=1.5",
    "transformers>=4.44",
    "langgraph>=1.0",
    "anthropic>=1.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
