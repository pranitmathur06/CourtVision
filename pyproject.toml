[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courtvision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
    # ByteTrack is deprecated in 0.28 and REMOVED in 0.31, with no in-package
    # replacement offered. Pinned below the removal so tracking cannot break
    # silently; PlayerTracker exists to absorb the swap when one lands.
    "supervision>=0.25,<0.31",
    "scikit-learn>=1.5",
    "transformers>=4.44",
    "langgraph>=1.0",
    "anthropic>=1.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only for live-game play-by-play (courtvision.nba_feed). Optional on
# purpose: the pipeline runs on archived clips with no network at all.
live = ["nba_api>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

# load_fused_kernel() reads the .cu next to its own module file, which works
# today only because everything is installed -e. A non-editable install would
# ship the Python and leave the kernel behind, and the failure would be a
# silent fall back to the portable path rather than an error.
[tool.setuptools.package-data]
"courtvision.kernels" = ["*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
